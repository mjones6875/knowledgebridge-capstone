name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: sh mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # GitHub Actions sets CI=true, so lint warnings fail the build here.
      - name: Build
        run: npm run build

  # Builds the Docker stack, starts it on GitHub's runner, and runs the smoke test.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use example settings
        run: |
          cp .env.example .env
          # No AI key in CI, so gBrain runs without embeddings and search uses keywords.
          sed -i 's/^OPENROUTER_API_KEY=.*/OPENROUTER_API_KEY=/' .env
      - name: Check compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start gBrain
        run: |
          docker compose up -d gbrain-postgres gbrain
          timeout 300 bash -c 'until curl -sf http://localhost:7333/health >/dev/null; do sleep 5; done'
      - name: Create a gBrain token for the backend
        run: |
          token=$(docker compose exec -T gbrain gbrain auth create ci --scopes read,write | grep -o 'gbrain_[A-Za-z0-9_-]*' | head -1)
          [ -n "$token" ]
          echo "::add-mask::$token"
          sed -i "s|^GBRAIN_TOKEN=.*|GBRAIN_TOKEN=$token|" .env
      - name: Start everything
        run: |
          docker compose up -d
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health >/dev/null; do sleep 5; done'
      - name: Smoke test
        run: bash scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Shut down
        if: always()
        run: docker compose down -v
