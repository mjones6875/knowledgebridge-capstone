name: Publish images

# Builds the app images and pushes them to GitHub's container registry, so anyone can
# pull them instead of building locally. main publishes "latest"; a v* tag publishes
# that version too.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use example settings
        run: cp .env.example .env
      - name: Log in to GitHub's container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push latest
        if: github.ref == 'refs/heads/main'
        run: |
          docker compose build backend gbrain transcription
          docker compose push backend gbrain transcription
      - name: Build and push the release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KB_VERSION: ${{ github.ref_name }}
        run: |
          docker compose build backend gbrain transcription
          docker compose push backend gbrain transcription
