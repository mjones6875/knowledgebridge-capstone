spring.application.name=knowledgebridge-api
server.port=8080

gbrain.base-url=${GBRAIN_BASE_URL:http://localhost:8787}
gbrain.token=${GBRAIN_TOKEN}

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=knowledgebridge-api
spring.ai.mcp.client.version=0.0.1
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s

spring.ai.mcp.client.streamable-http.connections.gbrain.url=${gbrain.base-url}
spring.ai.mcp.client.streamable-http.connections.gbrain.endpoint=/mcp

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Estimated OpenRouter model pricing per one million tokens
knowledgebridge.cost.input-per-million=1.00
knowledgebridge.cost.output-per-million=5.00

# OpenAPI and Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true