services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledgebridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: knowledgebridge-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # gbrain isn't containerized here, it's an external service. If it's
      # running on the host machine, use host.docker.internal instead of
      # localhost, "localhost" inside a container means the container itself.
      GBRAIN_BASE_URL: ${GBRAIN_BASE_URL:-http://host.docker.internal:8787}
      GBRAIN_TOKEN: ${GBRAIN_TOKEN}
    ports:
      - "8080:8080"
    extra_hosts:
      # host.docker.internal only works out of the box on Docker Desktop
      # (Mac/Windows). On native Linux (like an EC2 instance), this line is
      # what makes that same hostname actually resolve to the host machine.
      - "host.docker.internal:host-gateway"

  # frontend intentionally not containerized for local dev, see DOCKER_SETUP.md
  # (local-only file) for why: the browser talks to the backend directly, so
  # running the React dev server natively via `npm start` is simpler and
  # avoids container-networking issues for no real benefit.

volumes:
  postgres_data:
