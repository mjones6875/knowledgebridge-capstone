services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledgebridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # gbrain's own database. The name is fixed, the gbrain entrypoint waits for
  # a host called exactly "gbrain-postgres".
  gbrain-postgres:
    image: pgvector/pgvector:pg16
    container_name: gbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: ${GBRAIN_POSTGRES_PASSWORD:-gbrain_local_dev_only}
      POSTGRES_DB: gbrain
    volumes:
      - gbrain_postgres_data:/var/lib/postgresql/data

  # Built from the sponsor's docker-gbrain wrapper (vendored in ./gbrain).
  gbrain:
    build:
      context: ./gbrain
      args:
        GBRAIN_TAG: v0.48.5.0
    container_name: knowledgebridge-gbrain
    restart: unless-stopped
    depends_on:
      - gbrain-postgres
    environment:
      DATABASE_URL: postgres://gbrain:${GBRAIN_POSTGRES_PASSWORD:-gbrain_local_dev_only}@gbrain-postgres:5432/gbrain
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-60}
    ports:
      - "7333:7333"
    volumes:
      - gbrain_data:/data/brain

  backend:
    build: ./backend
    container_name: knowledgebridge-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - gbrain
    environment:
      # Defaults to the gbrain container. To use a gbrain running on your own
      # machine instead, set GBRAIN_BASE_URL=http://host.docker.internal:8787
      GBRAIN_BASE_URL: ${GBRAIN_BASE_URL:-http://gbrain:7333}
      GBRAIN_TOKEN: ${GBRAIN_TOKEN}
    ports:
      - "8080:8080"
    extra_hosts:
      # host.docker.internal only works out of the box on Docker Desktop
      # (Mac/Windows). On native Linux (like an EC2 instance), this line is
      # what makes that same hostname actually resolve to the host machine.
      - "host.docker.internal:host-gateway"

  # frontend intentionally not containerized for local dev, see DOCKER_SETUP.md
  # (local-only file) for why: the browser talks to the backend directly, so
  # running the React dev server natively via `npm start` is simpler and
  # avoids container-networking issues for no real benefit.

volumes:
  postgres_data:
  gbrain_postgres_data:
  gbrain_data:
